<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Treasurer | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #030304;
            --card-bg: #0b0b0f;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #ffffff;
            --text-muted: #9a9a9f;
            --border-color: rgba(212, 175, 55, 0.2);
            --transition: all 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 3rem 2.5rem;
            border-radius: 4px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            text-align: center;
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            color: var(--gold);
            letter-spacing: 3px;
            margin-bottom: 0.3rem;
        }

        .brand-sub {
            color: var(--text-muted);
            font-size: 0.75rem;
            letter-spacing: 2px;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .input-field {
            position: relative;
        }

        .input-field i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
            font-size: 0.9rem;
        }

        .input-field input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            border-radius: 2px;
            box-sizing: border-box;
            transition: var(--transition);
        }

        .input-field input:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .submit-btn {
            background: var(--gold);
            color: var(--bg-color);
            border: none;
            width: 100%;
            padding: 0.9rem;
            font-weight: 700;
            letter-spacing: 2px;
            border-radius: 2px;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background: var(--gold-light);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        .footer-links {
            margin-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .footer-links a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        #alert-msg {
            padding: 0.8rem;
            margin-bottom: 1.5rem;
            border-radius: 2px;
            font-size: 0.8rem;
            display: none;
        }
        .alert-error { background: rgba(255, 77, 77, 0.1); border: 1px solid #ff4d4d; color: #ff4d4d; }
        .alert-success { background: rgba(77, 255, 136, 0.1); border: 1px solid #4dff88; color: #4dff88; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 class="brand-title">THE TREASURER</h2>
        <p class="brand-sub">Access Your Portal</p>

        <div id="alert-msg"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="email">Email Address</label>
                <div class="input-field">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="customer@example.com" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-field">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <!-- Hidden Role Input (Defaults to Customer) -->
            <input type="hidden" id="role" value="Customer">

            <button type="submit" class="submit-btn">SIGN IN</button>
        </form>

        <div class="footer-links">
            Don't have an account? <a href="register.html">Register here</a>
            <br><br>
            <a href="index.html" style="color: var(--text-muted); font-size: 0.75rem;"><i class="fas fa-arrow-left"></i> Back to Storefront</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        async function handleLogin(e) {
            e.preventDefault();
            const alertMsg = document.getElementById('alert-msg');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            // Auto-detect admin email for backend verification
            let role = 'Customer';
            if (email.toLowerCase() === 'admin@treasurer.com') {
                role = 'Admin';
            }

            alertMsg.style.display = 'none';

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role })
                });

                const data = await res.json();

                if (res.ok) {
                    alertMsg.className = 'alert-success';
                    alertMsg.innerText = 'Login successful! Redirecting...';
                    alertMsg.style.display = 'block';

                    localStorage.setItem('treasurer_user', JSON.stringify(data.user));

                    setTimeout(() => {
                        if (data.user.role === 'Admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 1000);
                } else {
                    alertMsg.className = 'alert-error';
                    alertMsg.innerText = data.error || 'Invalid credentials';
                    alertMsg.style.display = 'block';
                }
            } catch (err) {
                alertMsg.className = 'alert-error';
                alertMsg.innerText = 'Server connection failed.';
                alertMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
