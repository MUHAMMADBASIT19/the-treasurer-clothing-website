<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register | The Treasurer</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030304;
            --card-bg: #0d0d11;
            --gold: #d4af37;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 3rem;
            border-radius: 4px;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .auth-header { text-align: center; margin-bottom: 2rem; }
        .auth-header h2 { font-family: 'Cinzel', serif; font-size: 1.8rem; letter-spacing: 2px; color: var(--gold); margin: 0 0 0.5rem 0; }
        .auth-header p { color: var(--text-muted); font-size: 0.85rem; letter-spacing: 1px; margin: 0; }

        .input-group { margin-bottom: 1.2rem; }
        .input-group label { display: block; font-size: 0.75rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.4rem; }
        .input-group input, .input-group select {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.8rem;
            border-radius: 2px;
            box-sizing: border-box;
            font-size: 0.9rem;
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--gold); outline: none; }

        .auth-btn {
            background: var(--gold);
            color: var(--bg-color);
            border: none;
            width: 100%;
            padding: 0.9rem;
            font-weight: 600;
            border-radius: 2px;
            cursor: pointer;
            letter-spacing: 1px;
            margin-top: 1rem;
            transition: background 0.3s;
        }
        .auth-btn:hover { background: #fff; }

        .switch-text { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted); }
        .switch-text a { color: var(--gold); text-decoration: none; font-weight: 600; }
        .switch-text a:hover { text-decoration: underline; }
        .back-home { display: block; text-align: center; margin-top: 1rem; color: var(--text-muted); font-size: 0.8rem; text-decoration: none; }
        .back-home:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <h2 id="form-title">LOGIN</h2>
            <p id="form-subtitle">Access your Treasurer portal</p>
        </div>

        <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="input-group" id="name-group" style="display: none;">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Muhammad Basit">
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <div class="input-group">
                <label>Portal Role</label>
                <select id="role">
                    <option value="customer">Customer</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button type="submit" class="auth-btn" id="submit-btn">SIGN IN</button>
        </form>

        <div class="switch-text">
            <span id="switch-prompt">Don't have an account?</span> 
            <a href="#" onclick="toggleMode(event)" id="switch-link">Register here</a>
        </div>
        <a href="index.html" class="back-home">&larr; Back to Storefront</a>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let isRegisterMode = false;

        function toggleMode(e) {
            e.preventDefault();
            isRegisterMode = !isRegisterMode;
            
            document.getElementById('form-title').innerText = isRegisterMode ? 'REGISTER' : 'LOGIN';
            document.getElementById('form-subtitle').innerText = isRegisterMode ? 'Create your new account' : 'Access your Treasurer portal';
            document.getElementById('submit-btn').innerText = isRegisterMode ? 'SIGN UP' : 'SIGN IN';
            document.getElementById('name-group').style.display = isRegisterMode ? 'block' : 'none';
            document.getElementById('switch-prompt').innerText = isRegisterMode ? 'Already have an account?' : "Don't have an account?";
            document.getElementById('switch-link').innerText = isRegisterMode ? 'Login here' : 'Register here';
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            if (isRegisterMode) {
                const name = document.getElementById('name').value;
                try {
                    const res = await fetch(`${API_URL}/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, email, password, role })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        alert(data.message);
                        toggleMode(e);
                    } else {
                        alert('Error: ' + data.error);
                    }
                } catch (err) { alert('Server connection error.'); }
            } else {
                try {
                    const res = await fetch(`${API_URL}/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password, role })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        alert(data.message);
                        const userRole = data.user.role ? data.user.role.toLowerCase() : '';
                        
                        if (userRole === 'admin' || data.user.email === 'admin@treasurer.com') {
                            data.user.role = 'Admin';
                            localStorage.setItem('treasurer_user', JSON.stringify(data.user));
                            window.location.href = 'admin.html';
                        } else {
                            localStorage.setItem('treasurer_user', JSON.stringify(data.user));
                            window.location.href = 'index.html';
                        }
                    } else {
                        alert('Error: ' + (data.error || data.message));
                    }
                } catch (err) { alert('Server connection error.'); }
            }
        }
    </script>
</body>
</html>
